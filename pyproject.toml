[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bawm"
version = "0.1.0"
description = "Calibrated probabilistic overlap confidences for long-read genome assembly."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Raja Giddi", email = "REDACTED" },
]
license = { text = "TBD" }
keywords = ["genome-assembly", "long-read", "minimap2", "bayesian", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "biopython>=1.83",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gpu = ["modal>=0.60"]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/USER/bawm"
Issues   = "https://github.com/USER/bawm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bawm*"]

[tool.ruff]
line-length = 100
target-version = "py310"
